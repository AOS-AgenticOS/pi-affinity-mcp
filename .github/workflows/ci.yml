name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/ is not stale
        run: npm run verify:dist
      - run: npm run typecheck:extension
      - run: npm test
      - name: Package contents (no docs, no tests, no build leftovers)
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            const banned = files.filter((f) =>
              f.startsWith("test/") || f.startsWith("reference/") || f.endsWith(".py") || f.endsWith(".map"));
            if (banned.length) {
              console.error("unexpected files in the tarball:", banned);
              process.exit(1);
            }
            console.log(`${files.length} files in the tarball`);
          '
